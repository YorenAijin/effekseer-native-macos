name: EffekseerNativeForJava macOS x86_64

on:
  push:
  workflow_dispatch:

jobs:
  macos-x86_64:
    # Any supported macOS image: the library is cross-compiled for x86_64 below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same native code as the Windows DLL shipped in EffekseerCraft-DEFINITIVE.jar:
      # EffekseerCraft 0.3.5.1.11 -> Effekseer4J -> MrMks/EffekseerForMultiLanguages
      # (master of 2023-05-06, itself an unmodified copy of effekseer/EffekseerForMultiLanguages).
      # Only the Effekseer submodule is needed (no recursive checkout: Metal/LLGI is disabled).
      - uses: actions/checkout@v4
        with:
          repository: MrMks/EffekseerForMultiLanguages
          ref: 1abcf343ce9d2fbaddb67c7c00e7490840743a19
          path: efml
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install SWIG
        run: brew install swig

      # Minecraft 1.12.2 (LWJGL 2) only gets a legacy OpenGL 2.1 context on macOS,
      # and the original code forces Effekseer's OpenGL3 renderer (GLSL 330, VAOs).
      # Effekseer's OpenGL2 renderer uses GLSL 120 and no VAO.
      - name: Use the OpenGL2 renderer
        working-directory: efml/src/cpp/Core
        run: |
          perl -pi -e 's/EffekseerRendererGL::OpenGLDeviceType::OpenGL3/EffekseerRendererGL::OpenGLDeviceType::OpenGL2/g' EffekseerBackendCore.cpp EffekseerManagerCore.cpp
          grep -n "OpenGLDeviceType" EffekseerBackendCore.cpp EffekseerManagerCore.cpp
          if grep -q "OpenGLDeviceType::OpenGL3" EffekseerBackendCore.cpp EffekseerManagerCore.cpp; then
            echo "OpenGL3 still used"
            exit 1
          fi

      - name: Generate SWIG wrappers
        working-directory: efml/src
        run: sh ./generate_swig_wrapper.sh

      # The launcher is x64 only on macOS (Rosetta on Apple Silicon), so is Minecraft's Java.
      # On failure the error lines are also written as an annotation (readable without logging in).
      - name: Build
        working-directory: efml
        run: |
          report() {
            msg=$( (grep -E -i "error|undefined|not found|fatal" "$1" | head -n 40; echo "----- last lines:"; tail -n 15 "$1") \
              | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$2::$msg"
          }
          if ! cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DBUILD_EXAMPLES=OFF -DBUILD_TEST=OFF -DBUILD_METAL=OFF -DBUILD_VULKAN=OFF -DBUILD_DX12=OFF > configure.log 2>&1; then
            cat configure.log; report configure.log "CMake configure failed"; exit 1
          fi
          cat configure.log
          if ! cmake --build build --config Release --target EffekseerNativeForJava -j 4 > build.log 2>&1; then
            cat build.log; report build.log "Build failed"; exit 1
          fi
          tail -n 30 build.log

      # Must export exactly the same JNI functions as the Windows DLL of the jar.
      - name: Check the library
        run: |
          lib=$(find efml/build -name 'libEffekseerNativeForJava.dylib' | head -n 1)
          test -n "$lib"
          file "$lib"
          lipo -archs "$lib"
          lipo -archs "$lib" | grep -qx x86_64
          otool -L "$lib"
          nm -gU "$lib" | awk '{print $3}' | sed 's/^_//' | grep '^Java_' | LC_ALL=C sort > actual-jni-exports.txt
          tr -d '\r' < expected-jni-exports.txt | LC_ALL=C sort > expected.txt
          if ! diff -u expected.txt actual-jni-exports.txt > exports.diff; then
            cat exports.diff
            echo "::error title=JNI exports differ::$(head -n 60 exports.diff | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "JNI exports: $(wc -l < actual-jni-exports.txt) (same as the Windows DLL)"
          mkdir -p dist/native/macos/x86_64
          cp "$lib" dist/native/macos/x86_64/libEffekseerNativeForJava.dylib
          cp actual-jni-exports.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: effekseer-native-macos-x86_64
          path: dist
